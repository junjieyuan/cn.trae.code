app-id: cn.trae.TraeCN
runtime: org.freedesktop.Sdk
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: trae-cn
tags: [proprietary]
separate-locales: false
finish-args:
  - --require-version=0.10.3
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --socket=ssh-auth
  - --device=all
  - --allow=devel
  - --filesystem=host
  - --env=LD_LIBRARY_PATH=/app/lib
  # required to fix cursor scaling on wayland
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
  - --system-talk-name=org.freedesktop.login1
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.kwalletd5
  - --talk-name=org.kde.kwalletd6
  - --talk-name=org.freedesktop.Flatpak
  - --talk-name=com.canonical.AppMenu.Registrar
  - --talk-name=com.canonical.AppMenu.Registrar.*
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/gtk-doc
  - '*.la'
modules:
  - name: trae-cn
    buildsystem: simple
    build-commands:
      - install -D cn.trae.TraeCN.sh /app/bin/trae-cn
      - install -Dm644 cn.trae.TraeCN-64.png /app/share/icons/hicolor/64x64/apps/cn.trae.TraeCN.png
      - install -Dm644 cn.trae.TraeCN-128.png /app/share/icons/hicolor/128x128/apps/cn.trae.TraeCN.png
      - install -Dm644 cn.trae.TraeCN-256.png /app/share/icons/hicolor/256x256/apps/cn.trae.TraeCN.png
      - install -Dm644 cn.trae.TraeCN-512.png /app/share/icons/hicolor/512x512/apps/cn.trae.TraeCN.png
      - install -Dm644 cn.trae.TraeCN.metainfo.xml -t /app/share/metainfo
      - install -Dm644 cn.trae.TraeCN.desktop -t /app/share/applications
      - install -Dm644 cn.trae.TraeCN-url-handler.desktop -t /app/share/applications
      - install -Dm644 cn.trae.TraeCN-workspace.xml -t /app/share/mime/packages
      - install -D apply_extra -t /app/bin
      # `ar` lives in the SDK but apply_extra only has the runtime available,
      # so ship it (plus its dependencies) inside the app.
      - cp /usr/bin/ar /app/bin
      - ARCH_TRIPLE=$(gcc --print-multiarch) && cp /usr/lib/${ARCH_TRIPLE}/libbfd-*.so
        /app/lib
      - ARCH_TRIPLE=$(gcc --print-multiarch) && cp /usr/lib/${ARCH_TRIPLE}/libsframe*
        /app/lib
      - ARCH_TRIPLE=$(gcc --print-multiarch) && ln -s /usr/lib/${ARCH_TRIPLE}/libtinfo.so
        /app/lib/libtinfo.so.5
    sources:
      - type: script
        dest-filename: apply_extra
        commands:
          - ar x trae-cn.deb
          - tar xf data.tar.xz
          - mv usr/share/trae-cn trae-cn
          - rm -r trae-cn.deb control.tar.* data.tar.xz debian-binary usr
      - type: file
        path: cn.trae.TraeCN.sh
      - type: file
        path: cn.trae.TraeCN.metainfo.xml
      - type: file
        path: cn.trae.TraeCN.desktop
      - type: file
        path: cn.trae.TraeCN-url-handler.desktop
      - type: file
        path: cn.trae.TraeCN-workspace.xml
      - type: file
        path: icons/cn.trae.TraeCN-64.png
      - type: file
        path: icons/cn.trae.TraeCN-128.png
      - type: file
        path: icons/cn.trae.TraeCN-256.png
      - type: file
        path: icons/cn.trae.TraeCN-512.png
      - type: extra-data
        filename: trae-cn.deb
        only-arches: [x86_64]
        url: https://lf-cdn.trae.com.cn/obj/trae-com-cn/pkg/app/releases/stable/2.3.87416/linux/TraeCode_CN-linux-x64.deb
        sha256: cf0e3529c0f4f06eb48e10bc0c3483815cf6a4bbf6e2a882b25579a42da2fca0
        size: 456007180
        x-checker-data:
          type: json
          url: https://api.trae.com.cn/icube/api/v1/native/version/trae/cn/latest
          version-query: '.data.manifest.linux.download[]
            | select(.region == "cn") | .["x64.deb"]
            | capture("/stable/(?<version>[^/]+)/").version'
          url-query: '.data.manifest.linux.download[]
            | select(.region == "cn") | .["x64.deb"]'
          is-main-source: true
      - type: extra-data
        filename: trae-cn.deb
        only-arches: [aarch64]
        url: https://lf-cdn.trae.com.cn/obj/trae-com-cn/pkg/app/releases/stable/2.3.87416/linux/TraeCode_CN-linux-arm64.deb
        sha256: bbdb9506d41f1f1c2eb6c4ff9d2c015c38ac60843c155d9ae4cf42f891e24c13
        size: 427860104
        x-checker-data:
          type: json
          url: https://api.trae.com.cn/icube/api/v1/native/version/trae/cn/latest
          version-query: '.data.manifest.linux.download[]
            | select(.region == "cn") | .["arm64.deb"]
            | capture("/stable/(?<version>[^/]+)/").version'
          url-query: '.data.manifest.linux.download[]
            | select(.region == "cn") | .["arm64.deb"]'

  - name: host-spawn
    buildsystem: simple
    build-commands:
      - install -Dm755 host-spawn /app/bin/host-spawn
    sources:
      - type: file
        url: https://github.com/1player/host-spawn/releases/download/v1.6.2/host-spawn-x86_64
        sha256: 077bc09a087292447ba17cfe2156a93f71bf56c4c6be8e38d3abe65c1240f34c
        dest-filename: host-spawn
        only-arches: [x86_64]
        x-checker-data:
          type: json
          url: https://api.github.com/repos/1player/host-spawn/releases/latest
          version-query: .tag_name
          timestamp-query: .published_at
          url-query: '"https://github.com/1player/host-spawn/releases/download/" +
            $version + "/host-spawn-x86_64"'

      - type: file
        url: https://github.com/1player/host-spawn/releases/download/v1.6.2/host-spawn-aarch64
        sha256: 8b30215b0b6b66c8c34a3e22d372dd39020295cd0904608bc2c5f5ecff829e5f
        dest-filename: host-spawn
        only-arches: [aarch64]
        x-checker-data:
          type: json
          url: https://api.github.com/repos/1player/host-spawn/releases/latest
          version-query: .tag_name
          timestamp-query: .published_at
          url-query: '"https://github.com/1player/host-spawn/releases/download/" +
            $version + "/host-spawn-aarch64"'
